[package]
name = "rtree-verify"
version = "0.1.0"
edition = { workspace = true }
autobins = false
# A cross-checking tool for development, not part of the released library. It
# lives in this workspace only for convenience.
publish = false

[package.metadata.release]
release = false

[features]
default = ["storage-rocksdb"]
storage-rocksdb = ["dep:noise-storage-rocksdb"]
storage-memory = ["dep:noise-storage-memory"]

[dependencies]
noise-storage = { workspace = true }
noise-storage-rocksdb = { workspace = true, optional = true }
noise-storage-memory = { workspace = true, optional = true }

[[bin]]
name = "rtree-verify-rocksdb"
path = "src/main.rs"
required-features = ["storage-rocksdb"]

[[bin]]
name = "rtree-verify-memory"
path = "src/main.rs"
required-features = ["storage-memory"]
